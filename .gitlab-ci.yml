default:
  image: "archlinux:latest"

stages:
  - lint
  - clean
  - vars
  - build
  - release

codespell:
  stage: lint
  before_script:
    - pacman -Syu --needed --noconfirm codespell
  script:
    - codespell --enable-colors
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

markdownlint:
  stage: lint
  before_script:
    - pacman -Syu --needed --noconfirm markdownlint
  script:
    - mdl --style .mdl_style.rb .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

shellcheck:
  stage: lint
  before_script:
    - pacman -Syu --needed --noconfirm shellcheck
  script:
    - find . -name '*.sh*' -exec shellcheck --color=always {} +
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-clean:
  stage: clean
  before_script:
    - pacman -Syu --needed --noconfirm make
  script:
    - make clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

set-variables:
  stage: vars
  script:
  - |
    export IMAGE_VERSION=$(date +'%Y.%m.%d')."${CI_PIPELINE_ID}"
    export PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/image/${IMAGE_VERSION}"
    echo "IMAGE_VERSION=${IMAGE_VERSION}" > variables.env
    echo "PACKAGE_REGISTRY_URL=${PACKAGE_REGISTRY_URL}" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

make-build:
  stage: build
  needs:
    - make-clean
    - set-variables
  dependencies:
    - set-variables
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - pacman -Syu --needed --noconfirm make devtools fakechroot fakeroot cosign
  script:
    - make build IMAGE_VERSION="${IMAGE_VERSION}"
    - cosign sign-blob workdir/output/archlinux-${IMAGE_VERSION}.wsl --bundle workdir/output/archlinux-${IMAGE_VERSION}.wsl.sig
  artifacts:
    paths:
      - workdir/output/*
    expire_in: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

upload-image-to-package-registry:
  stage: release
  needs:
    - make-build
    - set-variables
  dependencies:
    - make-build
    - set-variables
  script:
    - | 
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.SHA256"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.SHA256" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.sig"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.sig" "${PACKAGE_REGISTRY_URL}/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - upload-image-to-package-registry
    - set-variables
  dependencies:
    - set-variables
  script:
    - echo "Creating ${IMAGE_VERSION} release"
  release:
    name: "Release ${IMAGE_VERSION}"
    description: "Release ${IMAGE_VERSION}"
    tag_name: "${IMAGE_VERSION}"
    assets:
      links:
        - name: "archlinux-${IMAGE_VERSION}.wsl"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl"
        - name: "archlinux-${IMAGE_VERSION}.wsl.SHA256"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl.SHA256"
        - name: "archlinux-${IMAGE_VERSION}.wsl.sig"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl.sig"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
