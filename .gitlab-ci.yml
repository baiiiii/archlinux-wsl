default:
  image: "archlinux:latest"

stages:
  - lint
  - clean
  - vars
  - build
  - pre-release
  - release

codespell:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm codespell
  script:
    - codespell --enable-colors
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

markdownlint:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm markdownlint
  script:
    - mdl --style .mdl_style.rb .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

shellcheck:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm shellcheck
  script:
    - find . -name '*.sh*' -exec shellcheck --color=always {} +
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.make-clean:
  stage: clean
  before_script:
    - pacman -Syu --needed --noconfirm make
  script:
    - make clean

make-clean:
  extends: .make-clean
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-clean:secure:
  extends: .make-clean
  tags:
    - docker
    - secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.set-variables:
  stage: vars
  script:
    - |
      echo "IMAGE_VERSION=$(date +'%Y.%m.%d').${CI_PIPELINE_ID}" > variables.env
      echo "PACKAGE_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/image/${IMAGE_VERSION}" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

set-variables:
  extends: .set-variables
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

set-variables:secure:
  extends: .set-variables
  tags:
    - docker
    - secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.make-build:
  stage: build
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - pacman -Syu --needed --noconfirm make devtools fakechroot fakeroot cosign
  script:
    - make build IMAGE_VERSION="${IMAGE_VERSION}"
    - cosign sign-blob "workdir/output/archlinux-${IMAGE_VERSION}.wsl" --bundle "workdir/output/archlinux-${IMAGE_VERSION}.wsl.bundle"
  artifacts:
    paths:
      - workdir/output/*
    expire_in: 1h

make-build:
  extends: .make-build
  tags:
    - docker
  needs:
    - make-clean
    - set-variables
  dependencies:
    - set-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-build:secure:
  extends: .make-build
  tags:
    - docker
    - secure
  needs:
    - make-clean:secure
    - set-variables:secure
  dependencies:
    - set-variables:secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

upload-artifacts:
  stage: pre-release
  tags:
    - docker
    - secure
  needs:
    - make-build:secure
    - set-variables:secure
  dependencies:
    - make-build:secure
    - set-variables:secure
  script:
    - | 
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.SHA256"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.SHA256" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.bundle"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.bundle" "${PACKAGE_REGISTRY_URL}/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

create-release:
  stage: release
  tags:
    - docker
    - secure
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - upload-artifacts
    - set-variables:secure
  dependencies:
    - set-variables:secure
  script:
    - echo "Creating ${IMAGE_VERSION} release"
  release:
    name: "Release ${IMAGE_VERSION}"
    description: "Release ${IMAGE_VERSION}"
    tag_name: "${IMAGE_VERSION}"
    assets:
      links:
        - name: "archlinux-${IMAGE_VERSION}.wsl"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl"
        - name: "archlinux-${IMAGE_VERSION}.wsl.SHA256"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl.SHA256"
        - name: "archlinux-${IMAGE_VERSION}.wsl.bundle"
          url: "${PACKAGE_REGISTRY_URL}/archlinux-${IMAGE_VERSION}.wsl.bundle"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
