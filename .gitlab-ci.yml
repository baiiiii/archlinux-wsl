default:
  image: "archlinux:latest"

stages:
  - lint
  - vars
  - clean
  - build
  - test
  - release
  - cleanup

codespell:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm codespell
  script:
    - codespell --enable-colors
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

markdownlint:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm markdownlint
  script:
    - mdl --style .mdl_style.rb .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

shellcheck:
  stage: lint
  tags:
    - docker
  before_script:
    - pacman -Syu --needed --noconfirm shellcheck
  script:
    - find . -name '*.sh*' -exec shellcheck --color=always {} +
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.set-variables:
  stage: vars
  script:
    - |
      export IMAGE_VERSION=$(date +'%Y.%m.%d')."${CI_PIPELINE_ID}"
      export PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/image/${IMAGE_VERSION}"
      echo "IMAGE_VERSION=${IMAGE_VERSION}" > variables.env
      echo "PACKAGE_REGISTRY_URL=${PACKAGE_REGISTRY_URL}" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

set-variables:
  extends: .set-variables
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

set-variables:secure:
  extends: .set-variables
  tags:
    - docker
    - secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.make-clean:
  stage: clean
  before_script:
    - pacman -Syu --needed --noconfirm make
  script:
    - make clean

make-clean:
  extends: .make-clean
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-clean:secure:
  extends: .make-clean
  tags:
    - docker
    - secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.make-build:
  stage: build
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - pacman -Syu --needed --noconfirm make devtools fakechroot fakeroot cosign
  script:
    - make build IMAGE_VERSION="${IMAGE_VERSION}"
    - cosign sign-blob "workdir/output/archlinux-${IMAGE_VERSION}.wsl" --bundle "workdir/output/archlinux-${IMAGE_VERSION}.wsl.bundle"
  artifacts:
    paths:
      - workdir/*
    expire_in: 1h

make-build:
  extends: .make-build
  tags:
    - docker
  needs:
    - make-clean
    - set-variables
  dependencies:
    - set-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-build:secure:
  extends: .make-build
  tags:
    - docker
    - secure
  needs:
    - make-clean:secure
    - set-variables:secure
  dependencies:
    - set-variables:secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.make-test:
  stage: test
  before_script:
    - pacman -Syu --needed --noconfirm make fakechroot fakeroot git python cosign
  script:
    - make test IMAGE_VERSION="${IMAGE_VERSION}"
    - cd workdir/output/
    - sha256sum --check "archlinux-${IMAGE_VERSION}.wsl.SHA256"
    - cosign verify-blob archlinux-${IMAGE_VERSION}.wsl --bundle archlinux-${IMAGE_VERSION}.wsl.bundle --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/heads/${CI_COMMIT_REF_NAME}" --certificate-oidc-issuer "https://gitlab.archlinux.org"

make-test:
  extends: .make-test
  tags:
    - docker
  needs:
    - make-build
    - set-variables
  dependencies:
    - make-build
    - set-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

make-test:secure:
  extends: .make-test
  tags:
    - docker
    - secure
  needs:
    - make-build:secure
    - set-variables:secure
  dependencies:
    - make-build:secure
    - set-variables:secure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

upload-artifacts:
  stage: release
  tags:
    - docker
    - secure
  needs:
    - make-build:secure
    - make-test:secure
    - set-variables:secure
  dependencies:
    - make-build:secure
    - set-variables:secure
  script:
    - | 
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.SHA256"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.SHA256" "${PACKAGE_REGISTRY_URL}/"
      echo "Uploading archlinux-${IMAGE_VERSION}.wsl.bundle"
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "workdir/output/archlinux-${IMAGE_VERSION}.wsl.bundle" "${PACKAGE_REGISTRY_URL}/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

cleanup:
  stage: cleanup
  tags:
    - docker
    - secure
  needs:
    - upload-artifacts
  before_script:
    - pacman -Syu --needed --noconfirm jq
  script:
    - |
      for id in $(curl --silent --fail --show-error "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?per_page=100&order_by=created_at&sort=asc" | jq '.[] | select(.created_at | split("T")[0] | . < (now-60*60*24*90|strflocaltime("%Y-%m-%d"))) | .id'); do
        curl --silent --fail --show-error --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_PROJECT_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${id}"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
