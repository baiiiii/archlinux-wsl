<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 界面字体：更纱黑体的 UI 变体，中文按正常比例排版 -->
  <!-- 中英文名都列出，哪个注册得上用哪个（字体不一定注册了中文名） -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Sarasa UI SC</string>
      <string>更纱黑体 UI SC</string>
    </edit>
  </match>

  <!-- serif 也指向同一字体：Sarasa UI SC 本身是无衬线字体，
       所以衬线与无衬线在本镜像里外观一致 -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Sarasa UI SC</string>
      <string>更纱黑体 UI SC</string>
    </edit>
  </match>

  <!-- 等宽：Maple Mono Normal NL NF CN -->
  <!-- 它是终端字体，中文按 2:1 与西文对齐（这是它对齐代码/表格的本钱，
       但也让汉字字距天生偏大），所以不适合当界面字体 -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono Normal NL NF CN</string>
    </edit>
  </match>
</fontconfig>
